services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: validex
      POSTGRES_PASSWORD: validex   # local demo database only
      POSTGRES_DB: validex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validex"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://validex:validex@db:5432/validex
      JWT_SECRET: ${JWT_SECRET:-change-me-for-anything-shared}
      STORAGE_DIR: /data/files
      # Optional AI features (Groq). Put these in a .env file next to this file; both are off by default.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-false}
      LLM_SUMMARY_ENABLED: ${LLM_SUMMARY_ENABLED:-false}
      VISION_MODEL: ${VISION_MODEL:-qwen/qwen3.8-27b}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-openai/gpt-oss-120b}
    volumes:
      - files:/data/files
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  files:
