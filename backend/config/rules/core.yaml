# ILLUSTRATIVE validation rules. NOT taken from the official AICTE Approval Process Handbook.
# Every rule is deterministic. `condition.check` names a Python check in
# app/services/rules/checks.py; `condition.params` are passed to it.
illustrative: true
notice: "Illustrative rules for the prototype. Not official AICTE criteria."
name: core
version: 3
rules:
  - id: COMP-001
    description: Every required checklist document is uploaded.
    category: completeness
    severity: critical
    condition: {check: required_document_present}
    recommended_action: Upload the missing document in the checklist slot.
    version: 1
    visible_to_applicant: true

  - id: COMP-002
    description: Key fields can be read from each uploaded document.
    category: completeness
    severity: high
    condition:
      check: required_fields_present
      params:
        fields:
          fire_noc: [institution_name, certificate_number, issuing_authority, issue_date, expiry_date]
          affidavit: [institution_name, issue_date]
          accreditation_certificate: [institution_name, certificate_number, issue_date, expiry_date]
          land_document: [institution_name, certificate_number, issue_date, address]
          faculty_list: [institution_name, faculty_count]
    recommended_action: Upload a complete, legible copy where these fields are clearly printed.
    version: 1
    visible_to_applicant: true

  - id: COMP-003
    description: The uploaded file matches the checklist slot it was uploaded to.
    category: completeness
    severity: medium
    condition: {check: document_type_matches}
    recommended_action: Check that the right file was uploaded to this slot.
    version: 1
    visible_to_applicant: true

  - id: EXP-001
    description: Documents with an expiry date are still valid on the scrutiny date.
    category: expiry
    severity: critical
    condition: {check: document_not_expired}
    recommended_action: Upload a currently valid (renewed) document.
    version: 1
    visible_to_applicant: true

  - id: EXP-002
    description: Documents expiring soon are flagged for renewal.
    category: expiry
    severity: low
    condition: {check: expiring_soon, params: {within_days: 90}}
    recommended_action: Plan renewal; the document expires within the review window.
    version: 1
    visible_to_applicant: true

  - id: DATE-001
    description: Issue date is not in the future and is before the expiry date.
    category: consistency
    severity: high
    condition: {check: valid_dates}
    recommended_action: Verify the dates printed on the document.
    version: 1
    visible_to_applicant: true

  - id: FMT-001
    description: Certificate / registration numbers follow the expected format.
    category: consistency
    severity: medium
    condition:
      check: identifier_format
      params:
        patterns:
          fire_noc: "^FNOC-[0-9]{4}-[0-9]{6}$"
          accreditation_certificate: "^ACC-[A-Z]{2,4}-[0-9]{6}$"
          land_document: "^LND-[A-Z]{2}-[0-9]{4}-[0-9]{5}$"
          affidavit: "^AFF-[0-9]{8}$"
    recommended_action: Check the certificate number against the original document.
    version: 1
    visible_to_applicant: true

  - id: CONS-001
    description: Institution name on each document matches the institute record.
    category: consistency
    severity: high
    condition: {check: name_matches_record, params: {threshold: 88}}
    recommended_action: Confirm the document belongs to this institution; explain any name change.
    version: 1
    visible_to_applicant: true

  - id: CONS-002
    description: Address on each document matches the institute record.
    category: consistency
    severity: medium
    condition: {check: address_matches_record, params: {threshold: 80}}
    recommended_action: Confirm the premises address; explain any relocation.
    version: 1
    visible_to_applicant: true

  - id: CONS-003
    description: Faculty count in the faculty list is consistent with the institute record.
    category: consistency
    severity: medium
    condition: {check: faculty_count_matches_record, params: {tolerance_pct: 10}}
    recommended_action: Reconcile the faculty list with the faculty count on record.
    version: 1
    visible_to_applicant: true

  - id: REC-001
    description: TER payment status on the institute record is paid.
    category: consistency
    severity: high
    condition: {check: ter_payment_paid}
    recommended_action: Complete the TER payment or upload proof of payment.
    version: 1
    visible_to_applicant: true

  - id: REC-002
    description: No unresolved deficiency is open on the institute record.
    category: consistency
    severity: medium
    condition: {check: no_open_deficiency}
    recommended_action: Address the deficiency noted on the institute record.
    version: 1
    visible_to_applicant: true

  - id: EXT-001
    description: Low-confidence extracted values need human confirmation.
    category: completeness
    severity: info
    condition: {check: low_confidence_fields}
    recommended_action: Officer to confirm or correct the extracted value against the document.
    version: 1
    visible_to_applicant: false

  # ---- Issuer verification (all sources are MOCK in this prototype) ----
  - id: VER-001
    description: Values on the document match the issuer's record.
    category: verification
    severity: high
    condition: {check: issuer_verification, params: {statuses: [mismatch]}}
    recommended_action: Compare the submitted and source values; ask the institution to explain or correct.
    version: 1
    visible_to_applicant: false

  - id: VER-002
    description: The issuer does not report the document as expired.
    category: verification
    severity: high
    condition: {check: issuer_verification, params: {statuses: [expired]}}
    recommended_action: Request a renewed document from the institution.
    version: 1
    visible_to_applicant: false

  - id: VER-003
    description: The document could be checked with its issuer.
    category: verification
    severity: medium
    condition: {check: issuer_verification, params: {statuses: [source_unavailable, manual_review]}}
    recommended_action: Verify manually with the issuing authority, or re-run verification later.
    version: 1
    visible_to_applicant: false

  - id: VER-004
    description: Issuer verification is complete (not pending).
    category: verification
    severity: low
    condition: {check: issuer_verification, params: {statuses: [pending]}}
    recommended_action: Re-run verification later; follow up if it stays pending.
    version: 1
    visible_to_applicant: false

  - id: SIG-001
    description: Digital signature presence is reported (presence only, not validated).
    category: verification
    severity: info
    condition: {check: signature_presence}
    recommended_action: If the signature matters, validate it with a proper signature validator.
    version: 1
    visible_to_applicant: false

  # ---- Anomaly indicators: preliminary, staff only, require manual review ----
  - id: ANO-001
    description: The same file is not uploaded in more than one checklist slot.
    category: anomaly
    severity: medium
    condition: {check: exact_duplicate_files}
    recommended_action: Check whether the right files were uploaded; ask the institution if unclear.
    version: 1
    visible_to_applicant: false

  - id: ANO-002
    description: Different checklist slots do not contain near-identical pages.
    category: anomaly
    severity: low
    condition: {check: near_duplicate_pages, params: {max_distance: 96}}
    recommended_action: Open both files and compare them side by side.
    version: 1
    visible_to_applicant: false

  - id: ANO-003
    description: PDF structure shows no later modification or editing-tool producer.
    category: anomaly
    severity: medium
    condition: {check: pdf_revision_indicators}
    recommended_action: Compare with the issuer's copy; ask for the original file if needed.
    version: 1
    visible_to_applicant: false

  - id: ANO-004
    description: The QR reference matches the printed certificate number.
    category: anomaly
    severity: medium
    condition: {check: qr_reference_mismatch}
    recommended_action: Verify the certificate number with the issuer.
    version: 1
    visible_to_applicant: false

  - id: ANO-005
    description: File dates are consistent with the printed issue date.
    category: anomaly
    severity: low
    condition: {check: irregular_dates}
    recommended_action: Review the document history; may be explained by re-saving or scanning.
    version: 1
    visible_to_applicant: false

  - id: ANO-006
    description: JPEG uploads show uniform error levels (ELA; weak signal on text documents).
    category: anomaly
    severity: low
    condition: {check: ela_indicator}
    recommended_action: Inspect the highlighted region in the original image.
    version: 1
    visible_to_applicant: false

  # ---- Cross-application intelligence (other institutions; officers only) ----
  - id: XAPP-001
    description: No other institution submitted the identical file.
    category: anomaly
    severity: medium
    condition: {check: cross_application_matches, params: {kind: same_file}}
    recommended_action: Compare both applications; the match may have a legitimate explanation.
    version: 1
    visible_to_applicant: false

  - id: XAPP-002
    description: The certificate / registration number is not used by another institution.
    category: anomaly
    severity: medium
    condition: {check: cross_application_matches, params: {kind: certificate_number}}
    recommended_action: Verify with the issuer which institution the certificate belongs to.
    version: 1
    visible_to_applicant: false

  - id: XAPP-003
    description: Faculty IDs are not also listed by another institution.
    category: anomaly
    severity: low
    condition: {check: cross_application_matches, params: {kind: faculty_ids, min_count: 3}}
    recommended_action: Check the shared faculty IDs; faculty can legitimately move between institutions.
    version: 1
    visible_to_applicant: false
